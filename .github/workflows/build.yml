name: Build

on:
  push:
    branches: [net10]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows, .NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK version
        run: dotnet --version

      - name: Restore
        run: dotnet restore RibbonLib.csproj

      - name: Build
        run: dotnet build RibbonLib.csproj -c Release --no-restore

      - name: Upload assembly
        uses: actions/upload-artifact@v4
        with:
          name: RibbonLib-net10
          path: bin/Release/net10.0-windows/RibbonLib.dll
          if-no-files-found: error
